```yaml
name: Build WASM

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Coraza Proxy WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install TinyGo
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.34.0/tinygo_0.34.0_amd64.deb
          sudo dpkg -i tinygo_0.34.0_amd64.deb

      - name: Check versions
        run: |
          go version
          tinygo version

      - name: Build WASM
        run: |
          go run mage.go build

      - name: Check WASM
        run: |
          echo "========== build directory =========="
          ls -lah build/

          echo "========== wasm files =========="
          find build -name "*.wasm" -type f -exec ls -lh {} \;

          test -f build/main.wasm

      - name: Upload main.wasm
        uses: actions/upload-artifact@v4
        with:
          name: coraza-proxy-wasm
          path: build/main.wasm
          if-no-files-found: error
```
