```yaml
name: Build WASM

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Coraza Proxy WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install TinyGo
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.34.0/tinygo_0.34.0_amd64.deb
          sudo dpkg -i tinygo_0.34.0_amd64.deb

      - name: Check versions
        run: |
          echo "Go:"
          go version

          echo "TinyGo:"
          tinygo version

      - name: Download dependencies
        run: |
          go mod download

      - name: Build WASM
        run: |
          go run mage.go build

      - name: Verify build
        run: |
          echo "Build directory:"
          ls -lah build/

          echo ""
          echo "WASM files:"
          find build -type f -name "*.wasm" -ls

          echo ""
          echo "Checking main.wasm..."
          test -f build/main.wasm

          echo ""
          echo "main.wasm:"
          ls -lh build/main.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: coraza-proxy-wasm
          path: build/main.wasm
          if-no-files-found: error
```
