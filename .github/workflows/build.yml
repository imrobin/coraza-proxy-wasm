```yaml
name: Build Coraza Proxy WASM

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup TinyGo
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.34.0/tinygo_0.34.0_amd64.deb
          sudo dpkg -i tinygo_0.34.0_amd64.deb

      - name: Check versions
        run: |
          go version
          tinygo version

      - name: Build WASM
        run: |
          go run mage.go build

      - name: Check build result
        run: |
          ls -lh build/
          test -f build/main.wasm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: coraza-proxy-wasm
          path: build/main.wasm
```
